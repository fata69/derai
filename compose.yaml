name: derai-collection-scheduler-local

x-scheduler: &scheduler
  build: .
  init: true
  stop_grace_period: 30s
  restart: "no"

services:
  db:
    image: postgres:17
    profiles: [dev]
    environment:
      POSTGRES_USER: derai_local_admin
      POSTGRES_PASSWORD: derai_local_admin
      POSTGRES_DB: derai_scheduler_local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-local-db.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./scripts/seed-local-db.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/003-tests.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U derai_local_admin -d derai_scheduler_local"]
      interval: 2s
      timeout: 3s
      retries: 30

  scheduler-dev:
    <<: *scheduler
    profiles: [dev]
    environment:
      DATABASE_URL: postgresql+psycopg://derai_worker@db:5432/derai_scheduler_local
      PGPASSWORD: derai_local_worker
      WORKER_INTERVAL: ${WORKER_INTERVAL-60}
      SOCIAL_COLLECTION_ENABLED: ${SOCIAL_COLLECTION_ENABLED-true}
      CONNECTOR_ARTICLE_MAX_PAGES: ${CONNECTOR_ARTICLE_MAX_PAGES-1}
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    <<: *scheduler
    profiles: [external]
    environment:
      DATABASE_URL: ${EXTERNAL_DATABASE_URL:-}
      PGPASSWORD: ${EXTERNAL_PGPASSWORD:-}
      WORKER_INTERVAL: ${WORKER_INTERVAL-60}
      SOCIAL_COLLECTION_ENABLED: ${SOCIAL_COLLECTION_ENABLED-true}
      CONNECTOR_ARTICLE_MAX_PAGES: ${CONNECTOR_ARTICLE_MAX_PAGES-1}

volumes:
  postgres-data:
